databases:
  - name: panchayat-db
    databaseName: smart_panchayat
    user: panchayat_user
    region: singapore
    plan: free
services:
  - type: web
    name: panchayat-unified
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: panchayat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: VILLAGE_NAME
        value: Alandi Gram Panchayat
      - key: API_BASE_URL
        value: https://panchayat-unified.onrender.com
