# Render deployment configuration
databases:
  - name: panchayat-db
    databaseName: smart_panchayat
    user: panchayat_user
    region: singapore
    plan: free

services:
  # Backend API
  - type: web
    name: panchayat-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/init_db.py && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: panchayat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: VILLAGE_NAME
        value: Alandi Gram Panchayat
      - key: DISTRICT
        value: Pune
      - key: STATE
        value: Maharashtra
      - key: TOTAL_WARDS
        value: 6

  # Family Portal
  - type: web
    name: panchayat-family-portal
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/family_portal.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: API_BASE_URL
        value: https://panchayat-backend.onrender.com

  # Sarpanch Dashboard
  - type: web
    name: panchayat-sarpanch-dashboard
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/sarpanch_dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: API_BASE_URL
        value: https://panchayat-backend.onrender.com
